<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>照片轉 PDF 轉換器</title>
  
  <!-- SEO & PWA Meta -->
  <meta name="description" content="快速、安全且完全離線運作的照片轉 PDF 工具。支援多圖拖拉排序、旋轉、調整版面與壓縮，保護您的隱私。">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons via CDN for modern UI elements -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <div class="logo-icon">
          <i class="fa-solid fa-file-pdf"></i>
        </div>
        <div class="logo-text">
          <h1>PDF Converter</h1>
          <p>照片轉 PDF 專家 <span class="badge offline-badge"><i class="fa-solid fa-wifi-slash"></i> 離線運作</span></p>
        </div>
      </div>
      <button id="install-btn" class="install-btn hidden">
        <i class="fa-solid fa-download"></i> 安裝 App
      </button>
    </header>

    <!-- Main Content -->
    <main class="app-main">
      <!-- Upload Drop Zone -->
      <section class="upload-section card">
        <div id="drop-zone" class="drop-zone">
          <input type="file" id="file-input" multiple accept="image/png, image/jpeg, image/webp" class="file-input">
          <div class="drop-zone-content">
            <div class="upload-icon-wrapper">
              <i class="fa-solid fa-cloud-arrow-up animate-bounce"></i>
            </div>
            <h3>點擊或拖放照片至此處</h3>
            <p class="subtitle">支援多張 JPG, PNG, WEBP 格式</p>
            <button class="btn btn-primary btn-upload-trigger">
              <i class="fa-solid fa-image"></i> 選擇照片
            </button>
            <button class="btn btn-secondary btn-camera-trigger" id="camera-btn">
              <i class="fa-solid fa-camera"></i> 開啟相機
            </button>
          </div>
        </div>
      </section>

      <!-- Preview & Order Section -->
      <section id="preview-section" class="preview-section card hidden">
        <div class="section-header">
          <h2>已選取照片 (<span id="photo-count">0</span>)</h2>
          <div class="section-actions">
            <button id="clear-all-btn" class="btn-text text-danger">
              <i class="fa-solid fa-trash-can"></i> 全部清除
            </button>
          </div>
        </div>
        <p class="helper-text"><i class="fa-solid fa-arrows-alt"></i> 長按或拖曳照片可調整 PDF 排序</p>
        
        <div id="preview-grid" class="preview-grid">
          <!-- Dynamically populated via JS -->
        </div>
      </section>

      <!-- Settings & Generation Section -->
      <section id="settings-section" class="settings-section card hidden">
        <h2>輸出設定</h2>
        
        <div class="settings-grid">
          <!-- PDF Name -->
          <div class="setting-item full-width">
            <label for="pdf-filename">PDF 檔案名稱</label>
            <div class="input-wrapper">
              <input type="text" id="pdf-filename" value="My_Converted_Photos" placeholder="請輸入檔名">
              <span class="suffix">.pdf</span>
            </div>
          </div>

          <!-- Page Size -->
          <div class="setting-item">
            <label for="page-size">紙張尺寸</label>
            <select id="page-size">
              <option value="a4" selected>A4 (210 x 297 mm)</option>
              <option value="letter">Letter (8.5 x 11 in)</option>
              <option value="auto">自動 (符合照片比例)</option>
            </select>
          </div>

          <!-- Orientation -->
          <div class="setting-item">
            <label for="page-orientation">紙張方向</label>
            <select id="page-orientation">
              <option value="auto" selected>自動適應</option>
              <option value="portrait">直向 (Portrait)</option>
              <option value="landscape">橫向 (Landscape)</option>
            </select>
          </div>

          <!-- Margin -->
          <div class="setting-item">
            <label for="page-margin">邊距大小</label>
            <select id="page-margin">
              <option value="0" selected>無邊距 (0mm)</option>
              <option value="10">小邊距 (10mm)</option>
              <option value="20">中邊距 (20mm)</option>
            </select>
          </div>

          <!-- Quality Slider -->
          <div class="setting-item">
            <label for="image-quality">圖片品質 (壓縮)</label>
            <select id="image-quality">
              <option value="1.0">最佳品質 (無壓縮)</option>
              <option value="0.8" selected>高 (建議，檔案適中)</option>
              <option value="0.5">中 (壓縮率高)</option>
              <option value="0.3">低 (最小檔案)</option>
            </select>
          </div>
        </div>

        <!-- Submit Button -->
        <button id="generate-btn" class="btn btn-large btn-gradient">
          <i class="fa-solid fa-file-pdf"></i> 生成 PDF 檔案
        </button>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer-info">
      <p>完全本機運作，照片不會上傳到任何伺服器，保護隱私安全。</p>
    </footer>
  </div>

  <!-- Hidden Input for Native Camera Capture (works over HTTP on mobile) -->
  <input type="file" id="camera-input" accept="image/*" capture="environment" style="position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none;">

  <!-- Loading / Progress Modal -->
  <div id="progress-modal" class="modal hidden">
    <div class="modal-content glassmorphism card-modal text-center">
      <div class="spinner-wrapper">
        <div class="custom-spinner"></div>
        <div class="progress-percent" id="progress-text">0%</div>
      </div>
      <h3 id="progress-title">正在生成 PDF 檔案...</h3>
      <p id="progress-desc">正在處理您的照片，請稍候。</p>
      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <!-- Success Modal -->
  <div id="success-modal" class="modal hidden">
    <div class="modal-content glassmorphism card-modal text-center">
      <div class="success-icon-wrapper">
        <i class="fa-solid fa-circle-check animate-scale"></i>
      </div>
      <h3>PDF 生成成功！</h3>
      <p class="pdf-meta-info" id="success-meta">檔案大小: -- | 頁數: --</p>
      
      <div class="modal-actions">
        <button id="download-pdf-btn" class="btn btn-gradient btn-large">
          <i class="fa-solid fa-download"></i> 下載 PDF
        </button>
        <button id="share-pdf-btn" class="btn btn-secondary btn-large">
          <i class="fa-solid fa-share-nodes"></i> 分享 PDF
        </button>
        <button id="close-success-btn" class="btn btn-text">
          返回修改
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script type="module" src="./app.js"></script>
</body>
</html>
